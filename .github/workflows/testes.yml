name: Testes rápidos

# Roda só os testes que não usam modelo de voz nem internet: sem placa de vídeo e sem microfone
# (a captura de áudio nos testes é sempre simulada). Não envia nada para fora do GitHub.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependências (sem as bibliotecas de placa de vídeo)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Testes rápidos
        run: python -m pytest -m "not modelo and not rede" -q
